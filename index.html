<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<meta name="description" content="Track daily habits, exercise goals, and streaks.">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="./manifest.json">
<link rel="icon" href="./icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="./icons/icon.svg">
<title>Daily Habit &amp; Streak Tracker</title>
<style>
:root{color-scheme:dark;--bg:#0f172a;--card:#1e293b;--border:#334155;--text:#f8fafc;--muted:#94a3b8;--accent:#10b981;--blue:#3b82f6;--danger:#ef4444;--fire:#f59e0b}
*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--text);min-height:100vh;padding:16px;display:flex;justify-content:center}
main{width:100%;max-width:440px;display:flex;flex-direction:column;gap:18px;padding-bottom:32px}
header{display:flex;justify-content:space-between;align-items:center;padding-top:8px;gap:10px}
h1{font-size:1.5rem;letter-spacing:-.5px} .muted{color:var(--muted);font-size:.85rem;margin-top:3px}
.badge{white-space:nowrap;border:1px solid #f59e0b66;background:#f59e0b1c;color:var(--fire);padding:7px 10px;border-radius:99px;font-size:.82rem;font-weight:700}
.summary{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:20px;background:linear-gradient(135deg,var(--card),var(--bg));border:1px solid var(--border);border-radius:20px;box-shadow:0 10px 25px #0005}
h2{font-size:1.05rem;margin-bottom:6px}.summary p{font-size:.85rem;color:var(--muted)}
.ring{position:relative;width:76px;height:76px;flex-shrink:0}.ring svg{width:76px;height:76px;transform:rotate(-90deg)}.ring circle{fill:none;stroke-width:8;stroke-linecap:round}.ring .track{stroke:var(--border)}.ring .meter{stroke:var(--accent);stroke-dasharray:188.5;stroke-dashoffset:188.5;transition:stroke-dashoffset .3s}.pct{position:absolute;inset:0;display:grid;place-items:center;font-weight:700}
.card{background:var(--card);border:1px solid var(--border);border-radius:20px;padding:18px}.cardhead{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:16px}.cardtitle{font-size:1rem;font-weight:650}.small{font-size:.72rem;color:var(--muted)}
.chart{height:120px;display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px;align-items:end;border-bottom:1px solid var(--border);padding:6px 0 10px}.day{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:7px;min-width:0}.bar{height:78px;width:14px;max-width:100%;border-radius:99px;background:var(--bg);display:flex;align-items:flex-end;overflow:hidden;padding:2px}.fill{width:100%;min-height:3px;border-radius:99px;background:linear-gradient(180deg,var(--accent),#059669);transition:height .3s}.day.today .label{color:var(--accent);font-weight:700}.day.today .bar{outline:1px solid var(--accent)}.label{font-size:.68rem;color:var(--muted)}
.list{display:flex;flex-direction:column;gap:10px}.habit{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:13px;background:#0f172a99;border:1px solid var(--border);border-radius:14px}.habit.done{border-color:#10b98166;background:#10b98114}.habit-main{display:flex;align-items:center;gap:11px;min-width:0;flex:1;cursor:pointer}.check{width:25px;height:25px;border:2px solid var(--muted);border-radius:8px;flex-shrink:0;display:grid;place-items:center;color:#0f172a;font-weight:900}.done .check{background:var(--accent);border-color:var(--accent)}.habit-name{font-size:.9rem;overflow-wrap:anywhere}.done .habit-name{text-decoration:line-through;color:var(--muted)}.dots{display:flex;gap:4px;margin-top:5px}.dot{width:6px;height:6px;border-radius:50%;background:var(--border)}.dot.on{background:var(--accent)}.right{display:flex;align-items:center;gap:6px;flex-shrink:0}.streak{font-size:.7rem;color:var(--muted);background:var(--bg);padding:5px 7px;border-radius:7px;white-space:nowrap}.delete{border:0;background:transparent;color:var(--muted);padding:5px;font-size:1rem}
form{display:flex;gap:8px;margin-top:14px}.input{flex:1;min-width:0;background:var(--bg);border:1px solid var(--border);color:var(--text);padding:12px;border-radius:12px;font-size:.9rem;outline:none}.input:focus{border-color:var(--blue)}button{cursor:pointer}.add{border:0;border-radius:12px;background:var(--accent);color:var(--bg);font-weight:800;font-size:1.35rem;padding:0 18px}.tools{display:flex;gap:8px;margin-top:12px}.secondary{flex:1;background:transparent;border:1px solid var(--border);color:var(--muted);padding:9px;border-radius:10px;font-size:.78rem}
</style>
</head>
<body><main>
<header><div><h1>Daily Goals</h1><p class="muted" id="date">Loading date…</p></div><div class="badge">🔥 <span id="overall">0d Active</span></div></header>
<section class="summary"><div><h2 id="motivation">Let's build today's streak!</h2><p id="count">0 of 0 goals completed today</p></div><div class="ring"><svg viewBox="0 0 72 72"><circle class="track" cx="36" cy="36" r="30"/><circle class="meter" id="meter" cx="36" cy="36" r="30"/></svg><div class="pct" id="pct">0%</div></div></section>
<section class="card"><div class="cardhead"><span class="cardtitle">Weekly Streak Chart</span><span class="small">Last 7 days</span></div><div class="chart" id="chart"></div></section>
<section class="card"><div class="cardhead"><span class="cardtitle">Today's Checklist</span><span class="small">Tap to log</span></div><div class="list" id="habits"></div>
<form id="form"><input class="input" id="newhabit" maxlength="40" placeholder="Add a new daily goal…" required><button class="add" aria-label="Add habit" type="submit">+</button></form>
<div class="tools"><button class="secondary" id="export">Export backup</button><button class="secondary" id="import">Import backup</button><input id="file" type="file" accept="application/json,.json" hidden></div></section>
</main>
<script>
const KEY='mobile_habits_v1', DAYKEY='mobile_habits_last_date_v1';
const defaults=[
{id:1,name:'400m Track Run (Pace Goal)',history:[1,1,0,1,1,1,1]},
{id:2,name:'15 Daily Pushups & Stretch',history:[1,1,1,1,1,1,1]},
{id:3,name:'Whole Foods Diet (Daliya, Eggs, Nuts)',history:[1,0,1,1,1,1,0]},
{id:4,name:'History Study Session',history:[1,1,1,0,1,1,0]},
{id:5,name:'Post-Run Recovery / Skincare',history:[0,1,1,1,0,1,0]}];
let habits;try{habits=JSON.parse(localStorage.getItem(KEY))||defaults}catch{habits=defaults}
const dayKey=(d=new Date())=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const today=dayKey(),last=localStorage.getItem(DAYKEY);
if(last&&last!==today){const a=last.split('-').map(Number),b=today.split('-').map(Number);const n=Math.max(0,Math.round((Date.UTC(b[0],b[1]-1,b[2])-Date.UTC(a[0],a[1]-1,a[2]))/86400000));if(n)habits=habits.map(h=>({...h,history:n>=7?Array(7).fill(0):h.history.slice(n).concat(Array(n).fill(0))}));}
localStorage.setItem(DAYKEY,today);
const save=()=>localStorage.setItem(KEY,JSON.stringify(habits));
const streak=a=>{let n=0;for(let i=a[6]===1?6:5;i>=0&&a[i]===1;i--)n++;return n};
const safe=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function render(){
 const now=new Date(),days=[];for(let i=6;i>=0;i--){let d=new Date(now);d.setDate(now.getDate()-i);days.push({label:i===0?'Today':['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][d.getDay()][0],today:i===0});}
 document.getElementById('date').textContent=now.toLocaleDateString('en-US',{weekday:'long',month:'short',day:'numeric'});
 const total=habits.length,done=habits.filter(h=>h.history[6]===1).length,p=total?Math.round(done/total*100):0;
 document.getElementById('count').textContent=done+' of '+total+' goals completed today';document.getElementById('pct').textContent=p+'%';document.getElementById('meter').style.strokeDashoffset=188.5-(p/100*188.5);
 document.getElementById('motivation').textContent=total&&p===100?'All goals crushed! 🎉':p>=50?'Halfway there, keep going!':"Let's build today's streak!";
 document.getElementById('habits').innerHTML=habits.map(h=>'<div class="habit '+(h.history[6]?'done':'')+'"><div class="habit-main" data-toggle="'+h.id+'"><div class="check">'+(h.history[6]?'✓':'')+'</div><div style="min-width:0"><div class="habit-name">'+safe(h.name)+'</div><div class="dots">'+h.history.map(v=>'<span class="dot '+(v?'on':'')+'"></span>').join('')+'</div></div></div><div class="right"><span class="streak">🔥 '+streak(h.history)+'d</span><button class="delete" data-delete="'+h.id+'" aria-label="Delete '+safe(h.name)+'">✕</button></div></div>').join('');
 document.getElementById('chart').innerHTML=days.map((d,i)=>{const c=habits.filter(h=>h.history[i]===1).length,q=total?Math.round(c/total*100):0;return '<div class="day '+(d.today?'today':'')+'"><div class="bar" title="'+c+'/'+total+' completed"><div class="fill" style="height:'+q+'%"></div></div><span class="label">'+d.label+'</span></div>'}).join('');
 let active=0;for(let i=0;i<7;i++){if(total&&habits.filter(h=>h.history[i]===1).length/total>=.5)active++}document.getElementById('overall').textContent=active+'d Active';
}
document.getElementById('habits').addEventListener('click',e=>{const t=e.target.closest('[data-toggle]'),d=e.target.closest('[data-delete]');if(d){habits=habits.filter(h=>h.id!==Number(d.dataset.delete));save();render()}else if(t){const h=habits.find(x=>x.id===Number(t.dataset.toggle));if(h)h.history[6]=h.history[6]?0:1;save();render()}});
document.getElementById('form').addEventListener('submit',e=>{e.preventDefault();const input=document.getElementById('newhabit'),name=input.value.trim();if(!name)return;habits.push({id:Date.now(),name,history:Array(7).fill(0)});input.value='';save();render()});
document.getElementById('export').addEventListener('click',()=>{const blob=new Blob([JSON.stringify({version:1,habits},null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='habit-tracker-backup.json';a.click();URL.revokeObjectURL(a.href)});
document.getElementById('import').addEventListener('click',()=>document.getElementById('file').click());
document.getElementById('file').addEventListener('change',async e=>{const f=e.target.files[0];if(!f)return;try{const data=JSON.parse(await f.text()),list=Array.isArray(data)?data:data.habits;if(!Array.isArray(list)||!list.every(h=>h&&typeof h.name==='string'&&Array.isArray(h.history)&&h.history.length===7))throw Error('Invalid backup');habits=list.map(h=>({id:Number(h.id)||Date.now()+Math.random(),name:h.name,history:h.history.map(v=>v?1:0)}));save();render();alert('Backup imported.')}catch(err){alert('Could not import this backup. Please select a valid habit-tracker JSON file.')}e.target.value=''});
if('serviceWorker'in navigator&&location.protocol.startsWith('http'))addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(console.error));
save();render();
</script></body></html>
