<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0b111e" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Daily Goals" />
  <title>Daily Goals</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icons/icon.svg" />
  <style>
    :root{--bg-main:#0b111e;--bg-card:#151f30;--bg-inner-card:#182336;--bg-pill-dark:#0d1522;--border-card:rgba(255,255,255,.07);--border-inner:rgba(255,255,255,.08);--text-white:#f8fafc;--text-muted:#8b9bb4;--text-dim:#5e708d;--accent-green:#10b981;--accent-amber:#f59e0b;--radius-outer:20px;--radius-inner:16px}
    *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
    html,body{background:var(--bg-main);color:var(--text-white);font-family:-apple-system,BlinkMacSystemFont,"Inter","Segoe UI",Roboto,sans-serif;min-height:100%;overflow-x:hidden}
    body{padding-bottom:env(safe-area-inset-bottom)}
    .app-shell{max-width:480px;margin:0 auto;padding:calc(1.1rem + env(safe-area-inset-top)) 1rem calc(2.5rem + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:1.1rem}
    .top-header{display:flex;justify-content:space-between;align-items:flex-start;padding:.25rem .1rem;gap:.7rem}.app-title{font-size:1.85rem;font-weight:800;letter-spacing:-.02em;line-height:1.15}.app-date{font-size:.92rem;color:var(--text-muted);margin-top:.2rem;font-weight:500}.streak-pill{display:inline-flex;align-items:center;gap:.4rem;background:rgba(245,158,11,.1);border:1px solid rgba(245,158,11,.45);color:var(--accent-amber);padding:.45rem .8rem;border-radius:999px;font-size:.85rem;font-weight:700;margin-top:.15rem;white-space:nowrap}
    .card{background:var(--bg-card);border:1px solid var(--border-card);border-radius:var(--radius-outer);padding:1.35rem 1.25rem;box-shadow:0 8px 24px rgba(0,0,0,.25)}.progress-card{display:flex;justify-content:space-between;align-items:center;gap:1rem}.progress-text h2{font-size:1.12rem;font-weight:700;margin-bottom:.35rem}.progress-text p{font-size:.9rem;color:var(--text-muted)}.ring-container{position:relative;width:90px;height:90px;flex-shrink:0;display:flex;align-items:center;justify-content:center}.ring-svg{transform:rotate(-90deg)}.ring-track{stroke:#2c3a4f}.ring-fill{stroke:var(--accent-green);transition:stroke-dashoffset .45s ease}.ring-label{position:absolute;font-size:1.05rem;font-weight:800}
    .section-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:1.1rem;gap:.5rem}.section-header h2{font-size:1.1rem;font-weight:700}.section-sub{font-size:.82rem;color:var(--text-muted);font-weight:500}
    .bars-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:.5rem;justify-items:center;padding:.2rem 0 .4rem}.bar-col{display:flex;flex-direction:column;align-items:center;gap:.65rem;width:100%}.bar-pill-outer{width:24px;height:112px;background:var(--bg-pill-dark);border-radius:999px;padding:4px;display:flex;align-items:flex-end;justify-content:center;border:1.5px solid transparent}.bar-col.is-today .bar-pill-outer{border-color:var(--accent-green);box-shadow:0 0 10px rgba(16,185,129,.15)}.bar-pill-inner{width:100%;background:var(--accent-green);border-radius:999px;min-height:4px;transition:height .4s ease}.bar-day{font-size:.78rem;color:var(--text-muted);font-weight:500}.bar-col.is-today .bar-day{color:var(--accent-green);font-weight:600}.chart-divider{height:1px;background:rgba(255,255,255,.06);margin:.9rem 0 1rem}.metrics-row{display:grid;grid-template-columns:repeat(3,1fr);gap:.6rem}.metric-card{background:var(--bg-inner-card);border:1px solid var(--border-inner);border-radius:12px;padding:.65rem .4rem;text-align:center;display:flex;flex-direction:column;gap:.15rem}.metric-title{font-size:.7rem;color:var(--text-muted)}.metric-val{font-size:1.05rem;font-weight:800;color:var(--accent-green)}
    .add-bar{display:flex;gap:.5rem;margin-bottom:1rem;width:100%}.add-input{flex:1;min-width:0;background:var(--bg-pill-dark);border:1px solid var(--border-inner);border-radius:12px;padding:.75rem .9rem;color:var(--text-white);font-size:.9rem;outline:none}.add-input::placeholder{color:var(--text-dim)}.add-input:focus{border-color:var(--accent-green)}.add-btn{background:var(--accent-green);color:#052e16;border:0;border-radius:12px;padding:0 .85rem;font-weight:800;font-size:.82rem;cursor:pointer;flex-shrink:0}.add-btn:active{transform:scale(.98)}
    .checklist-items{display:flex;flex-direction:column;gap:.75rem}.empty-state{color:var(--text-muted);text-align:center;padding:1.3rem .5rem;font-size:.9rem;background:var(--bg-inner-card);border:1px dashed var(--border-inner);border-radius:var(--radius-inner)}.task-card{background:var(--bg-inner-card);border:1px solid var(--border-inner);border-radius:var(--radius-inner);padding:.95rem 1rem;display:flex;align-items:center;justify-content:space-between;gap:.75rem;transition:opacity .2s,border-color .2s}.task-card.is-done{opacity:.62}.task-left{display:flex;align-items:center;gap:.8rem;flex:1;min-width:0}.task-checkbox{width:28px;height:28px;border-radius:8px;border:2px solid #6c7e98;background:transparent;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;color:transparent}.task-card.is-done .task-checkbox{background:var(--accent-green);border-color:var(--accent-green);color:#052e16}.task-checkbox svg{width:16px;height:16px;stroke:currentColor;stroke-width:3;fill:none}.task-info{display:flex;flex-direction:column;gap:.42rem;min-width:0;flex:1}.task-name{font-size:1rem;font-weight:500;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.task-card.is-done .task-name{text-decoration:line-through;color:var(--text-muted)}.task-edit-field{background:var(--bg-pill-dark);border:1px solid var(--accent-green);color:var(--text-white);border-radius:6px;padding:.25rem .45rem;font-size:.98rem;width:100%;outline:none}.task-dots{display:flex;align-items:center;gap:5px}.mini-dot{width:6px;height:6px;border-radius:50%;background:#334155}.mini-dot.done{background:var(--accent-green)}.task-right{display:flex;align-items:center;gap:.5rem;flex-shrink:0}.task-streak{background:#101929;border-radius:999px;padding:.28rem .55rem;display:inline-flex;align-items:center;gap:.25rem;font-size:.78rem;font-weight:600;color:var(--text-muted);white-space:nowrap}.task-delete{background:transparent;border:0;color:var(--text-muted);width:26px;height:26px;display:inline-flex;align-items:center;justify-content:center;cursor:pointer}.task-delete svg{width:16px;height:16px;stroke:currentColor;stroke-width:2}.task-delete:hover{color:#ef4444}
    .status-message{font-size:.82rem;color:var(--text-muted);margin-top:.65rem;min-height:1em}.status-message.error{color:#fca5a5}
    @media(max-width:360px){.card{padding:1.1rem .9rem}.app-title{font-size:1.6rem}.streak-pill{font-size:.75rem;padding:.4rem .55rem}.task-streak{display:none}.add-btn{padding:0 .65rem}}
  </style>
</head>
<body>
  <main class="app-shell">
    <header class="top-header">
      <div><h1 class="app-title">Daily Goals</h1><p id="current-date" class="app-date"></p></div>
      <div class="streak-pill" title="Consecutive days with all goals completed"><span>🔥</span><span id="global-streak-label">0d Active</span></div>
    </header>

    <section class="card progress-card">
      <div class="progress-text"><h2 id="progress-title">Let's build today's streak!</h2><p id="progress-subtitle">0 of 0 goals completed today</p></div>
      <div class="ring-container"><svg class="ring-svg" width="90" height="90" viewBox="0 0 90 90"><circle class="ring-track" cx="45" cy="45" r="36" stroke-width="9" fill="transparent"/><circle id="ring-progress" class="ring-fill" cx="45" cy="45" r="36" stroke-width="9" fill="transparent" stroke-dasharray="226.19" stroke-dashoffset="226.19" stroke-linecap="round"/></svg><span id="ring-pct-text" class="ring-label">0%</span></div>
    </section>

    <section class="card chart-card">
      <div class="section-header"><h2>Weekly Streak Chart</h2><span class="section-sub">Last 7 days</span></div>
      <div id="weekly-bars" class="bars-grid"></div><div class="chart-divider"></div>
      <div class="metrics-row"><div class="metric-card"><span class="metric-title">Today</span><strong id="stat-today" class="metric-val">0%</strong></div><div class="metric-card"><span class="metric-title">Last 7 Days</span><strong id="stat-7d" class="metric-val">0%</strong></div><div class="metric-card"><span class="metric-title">Last 30 Days</span><strong id="stat-30d" class="metric-val">0%</strong></div></div>
    </section>

    <section class="card checklist-card">
      <div class="section-header"><h2>Today's Checklist</h2><span class="section-sub">Tap to log</span></div>
      <div id="checklist-container" class="checklist-items" aria-live="polite"></div>
      <form id="add-goal-form" class="add-bar" style="margin-top:1rem;margin-bottom:0">
        <input id="goal-input" type="text" class="add-input" placeholder="Add a new goal..." maxlength="60" autocomplete="off" aria-label="New goal" />
        <button type="submit" id="add-goal-btn" class="add-btn">Add Goal</button>
      </form>
      <p id="status-message" class="status-message" role="status"></p>
    </section>
  </main>

  <script>
  (() => {
    'use strict';
    const STORAGE_KEY = 'daily_goals_v10_data';
    const CIRCUMFERENCE = 2 * Math.PI * 36;
    const defaultTasks = [
      { id: 'goal-1', title: '30 Push-ups' },
      { id: 'goal-2', title: '60 Squats' },
      { id: 'goal-3', title: '60 Triceps' },
      { id: 'goal-4', title: '60 Crunches' }
    ];
    let state = { tasks: defaultTasks.map(task => ({...task})), history: {} };
    let editingTaskId = null;

    const $ = id => document.getElementById(id);
    function getDateKey(date = new Date()) {
      return `${date.getFullYear()}-${String(date.getMonth()+1).padStart(2,'0')}-${String(date.getDate()).padStart(2,'0')}`;
    }
    function getPastDateKey(daysAgo) { const date = new Date(); date.setDate(date.getDate()-daysAgo); return getDateKey(date); }
    function formatHeaderDate(date = new Date()) { return date.toLocaleDateString('en-US',{weekday:'long',month:'short',day:'numeric'}); }
    function getDayLetter(date) { return ['S','M','T','W','T','F','S'][date.getDay()]; }
    function showStatus(message, isError = false) {
      const el = $('status-message');
      if (!el) return;
      el.textContent = message;
      el.classList.toggle('error', isError);
    }
    function saveState() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
        return true;
      } catch (error) {
        console.error('Daily Goals: Failed to save state:', error);
        showStatus('Could not save data in this browser. Check storage settings.', true);
        return false;
      }
    }
    function loadState() {
      let raw;
      try { raw = localStorage.getItem(STORAGE_KEY); }
      catch (error) {
        console.error('Daily Goals: Cannot access localStorage:', error);
        showStatus('Browser storage is blocked. Goals may not persist after refresh.', true);
        return;
      }
      if (!raw) {
        state = { tasks: defaultTasks.map(task => ({...task})), history: {} };
        syncTodayRecord();
        return;
      }
      try {
        const parsed = JSON.parse(raw);
        if (!parsed || !Array.isArray(parsed.tasks) || !parsed.history || typeof parsed.history !== 'object') {
          throw new Error('Saved data has an invalid structure.');
        }
        state.tasks = parsed.tasks.filter(task => task && typeof task.id === 'string' && typeof task.title === 'string');
        state.history = parsed.history;
        // Keep valid empty task lists; don't silently replace them with defaults.
        syncTodayRecord();
      } catch (error) {
        console.error('Daily Goals: Failed to parse saved state:', error);
        showStatus('Saved data could not be read. It has not been overwritten; check the console.', true);
      }
    }
    function syncTodayRecord() {
      const today = getDateKey();
      const validIds = new Set(state.tasks.map(task => task.id));
      if (!state.history[today] || typeof state.history[today] !== 'object') {
        state.history[today] = { completedIds: [], totalCount: state.tasks.length };
      }
      const record = state.history[today];
      if (!Array.isArray(record.completedIds)) record.completedIds = [];
      record.completedIds = record.completedIds.filter(id => validIds.has(id));
      record.totalCount = state.tasks.length;
      saveState();
    }
    function getDayPct(dateKey) {
      const record = state.history[dateKey];
      if (!record || !record.totalCount) return 0;
      return Math.min(100, Math.round((record.completedIds.length / record.totalCount) * 100));
    }
    // Average the completion percentage for each of the most recent active days.
    // An active day is a date with a saved record and at least one goal.
    function getAverageActiveDayPct(activeDays) {
      let sumOfDailyPercentages = 0;
      let countedDays = 0;
      for (let offset = 0; offset < 3650 && countedDays < activeDays; offset++) {
        const record = state.history[getPastDateKey(offset)];
        if (!record || !Number.isFinite(record.totalCount) || record.totalCount <= 0) continue;
        const completed = Array.isArray(record.completedIds) ? record.completedIds.length : 0;
        const dailyPct = Math.min(100, (completed / record.totalCount) * 100);
        sumOfDailyPercentages += dailyPct;
        countedDays++;
      }
      return countedDays ? Math.round(sumOfDailyPercentages / countedDays) : 0;
    }
    function getGlobalStreak() {
      let streak = 0;
      const todayDone = state.tasks.length > 0 && getDayPct(getDateKey()) === 100;
      for (let i = todayDone ? 0 : 1; i < 3650; i++) {
        const record = state.history[getPastDateKey(i)];
        if (record && record.totalCount > 0 && record.completedIds.length >= record.totalCount) streak++;
        else break;
      }
      return streak;
    }
    function getTaskStreak(taskId) {
      let streak = 0;
      const doneToday = state.history[getDateKey()]?.completedIds?.includes(taskId);
      for (let i = doneToday ? 0 : 1; i < 3650; i++) {
        const record = state.history[getPastDateKey(i)];
        if (record?.completedIds?.includes(taskId)) streak++;
        else break;
      }
      return streak;
    }
    function toggleTask(taskId) {
      syncTodayRecord();
      const completed = state.history[getDateKey()].completedIds;
      const index = completed.indexOf(taskId);
      if (index === -1) completed.push(taskId); else completed.splice(index,1);
      saveState(); renderApp();
    }
    function addTask(title) {
      const clean = title.trim();
      if (!clean) return false;
      const task = { id: `goal-${Date.now()}-${Math.random().toString(36).slice(2,8)}`, title: clean };
      state.tasks.push(task);
      syncTodayRecord();
      const saved = saveState();
      renderApp();
      showStatus(saved ? `Added “${clean}”.` : 'Goal added for this session, but saving failed.', !saved);
      return true;
    }
    function saveTaskEdit(taskId, newTitle) {
      const clean = newTitle.trim();
      if (clean) {
        const task = state.tasks.find(item => item.id === taskId);
        if (task) task.title = clean;
        saveState();
      }
      editingTaskId = null; renderApp();
    }
    function removeTask(taskId) {
      state.tasks = state.tasks.filter(task => task.id !== taskId);
      syncTodayRecord(); saveState(); renderApp();
    }
    function makeSvg(markup) {
      const wrapper = document.createElement('span'); wrapper.innerHTML = markup; return wrapper.firstElementChild;
    }
    function renderApp() {
      const today = getDateKey();
      if (!state.history[today]) state.history[today] = { completedIds: [], totalCount: state.tasks.length };
      const todayRecord = state.history[today];
      if (!Array.isArray(todayRecord.completedIds)) todayRecord.completedIds = [];
      todayRecord.totalCount = state.tasks.length;
      const completedCount = state.tasks.filter(task => todayRecord.completedIds.includes(task.id)).length;
      const totalCount = state.tasks.length;
      const todayPct = totalCount ? Math.round(completedCount/totalCount*100) : 0;

      $('current-date').textContent = formatHeaderDate();
      $('global-streak-label').textContent = `${getGlobalStreak()}d Active`;
      $('progress-title').textContent = totalCount && completedCount === totalCount ? 'All goals completed!' : "Let's build today's streak!";
      $('progress-subtitle').textContent = `${completedCount} of ${totalCount} goals completed today`;
      $('ring-pct-text').textContent = `${todayPct}%`;
      $('ring-progress').style.strokeDashoffset = (CIRCUMFERENCE - todayPct/100*CIRCUMFERENCE).toFixed(2);

      const bars = $('weekly-bars'); bars.replaceChildren();
      for (let i=6;i>=0;i--) {
        const date = new Date(); date.setDate(date.getDate()-i);
        const pct = getDayPct(getDateKey(date));
        const col = document.createElement('div'); col.className = `bar-col${i===0?' is-today':''}`;
        const outer = document.createElement('div'); outer.className = 'bar-pill-outer';
        const inner = document.createElement('div'); inner.className = 'bar-pill-inner'; inner.style.height = `${Math.max(4,pct)}%`;
        const label = document.createElement('span'); label.className = 'bar-day'; label.textContent = i===0?'Today':getDayLetter(date);
        outer.append(inner); col.append(outer,label); bars.append(col);
      }
      $('stat-today').textContent = `${todayPct}%`;
      $('stat-7d').textContent = `${getAverageActiveDayPct(7)}%`;
      $('stat-30d').textContent = `${getAverageActiveDayPct(30)}%`;

      const container = $('checklist-container'); container.replaceChildren();
      if (!state.tasks.length) {
        const empty = document.createElement('div'); empty.className = 'empty-state'; empty.textContent = 'No goals yet. Add your first goal above.'; container.append(empty);
      }
      state.tasks.forEach(task => {
        const done = todayRecord.completedIds.includes(task.id);
        const card = document.createElement('div'); card.className = `task-card${done?' is-done':''}`;
        const left = document.createElement('div'); left.className = 'task-left';
        const check = document.createElement('button'); check.type='button'; check.className='task-checkbox'; check.setAttribute('aria-label',done?'Mark goal incomplete':'Mark goal complete'); check.append(makeSvg('<svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"></polyline></svg>')); check.addEventListener('click',()=>toggleTask(task.id));
        const info = document.createElement('div'); info.className='task-info';
        if (editingTaskId===task.id) {
          const input=document.createElement('input'); input.type='text'; input.className='task-edit-field'; input.value=task.title; input.maxLength=60;
          let committed=false; const commit=()=>{if(committed)return;committed=true;saveTaskEdit(task.id,input.value);};
          input.addEventListener('keydown',event=>{if(event.key==='Enter'){event.preventDefault();commit();}if(event.key==='Escape'){committed=true;editingTaskId=null;renderApp();}});
          input.addEventListener('blur',commit); info.append(input); requestAnimationFrame(()=>{input.focus();input.select();});
        } else {
          const name=document.createElement('span'); name.className='task-name'; name.textContent=task.title; name.title='Tap to edit'; name.addEventListener('click',()=>{editingTaskId=task.id;renderApp();}); info.append(name);
        }
        const dots=document.createElement('div'); dots.className='task-dots';
        for(let i=6;i>=0;i--){const dot=document.createElement('span');dot.className=`mini-dot${state.history[getPastDateKey(i)]?.completedIds?.includes(task.id)?' done':''}`;dots.append(dot);}
        info.append(dots); left.append(check,info);
        const right=document.createElement('div'); right.className='task-right';
        const badge=document.createElement('span'); badge.className='task-streak'; badge.textContent=`🔥 ${getTaskStreak(task.id)}d`;
        const del=document.createElement('button'); del.type='button'; del.className='task-delete'; del.setAttribute('aria-label',`Delete ${task.title}`); del.append(makeSvg('<svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>')); del.addEventListener('click',()=>removeTask(task.id));
        right.append(badge,del); card.append(left,right); container.append(card);
      });
    }
    function initApp() {
      loadState(); renderApp();
      const form = $('add-goal-form'); const input = $('goal-input');
      form.addEventListener('submit', event => {
        event.preventDefault();
        const title = input.value.trim();
        if (!title) { input.focus(); showStatus('Enter a goal first.'); return; }
        const added = addTask(title);
        if (added) { input.value=''; input.focus(); }
      });
    }
    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded',initApp,{once:true});
    else initApp();
  })();
  </script>
</body>
</html>
